services:
  server:
    build: ./server
    container_name: cattle-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # MONGO_URI comes from server/.env (your MongoDB Atlas connection string)
      - CLIENT_URL=http://localhost:5173
      - PORT=5000
    ports:
      - "5000:5000"

  client:
    build: ./client
    container_name: cattle-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      - VITE_API_PROXY_TARGET=http://server:5000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
